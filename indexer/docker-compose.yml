# FluxaPay Indexer Docker Compose for local development
# Runs PostgreSQL and the event indexer service

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fluxapay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fluxapay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxapay-indexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/fluxapay
      SOROBAN_RPC_URL: http://stellar-quickstart:8000/soroban/rpc
      FLUXAPAY_CONTRACT_ID: ${FLUXAPAY_CONTRACT_ID}
      POLL_INTERVAL_MS: 5000
      START_LEDGER: 0
    networks:
      - fluxapay-network
    restart: on-failure

volumes:
  postgres-data:

networks:
  fluxapay-network:
    driver: bridge
